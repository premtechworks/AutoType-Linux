version: 1

AppDir:
  path: ./AppDir

  app_info:
    id: io.github.premtechworks.AutoType
    name: AutoType
    icon: io.github.premtechworks.AutoType
    version: 1.0.0
    exec: usr/bin/autotype
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble main universe'
        key_url: 'http://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C'
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - gir1.2-gtk-3.0
      - libportaudio2
      - libglib2.0-0
    exclude:
      - sound-theme-freedesktop

  files:
    include:
      - io.github.premtechworks.AutoType.desktop: io.github.premtechworks.AutoType.desktop
      - io.github.premtechworks.AutoType.metainfo.xml: usr/share/metainfo/io.github.premtechworks.AutoType.metainfo.xml
      - icons/hicolor/scalable/apps/io.github.premtechworks.AutoType.svg: io.github.premtechworks.AutoType.svg

AppImage:
  arch: x86_64
  file_name: AutoType-1.0.0-x86_64.AppImage
