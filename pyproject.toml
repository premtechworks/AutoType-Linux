[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotype"
dynamic = ["version"]
description = "Voice-typing daemon for Linux Mint XFCE on X11"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "premtechworks"}
]
dependencies = [
    "sounddevice>=0.4.6,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "requests>=2.28.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pynput>=1.7.6,<2.0.0",
    "deepgram-sdk>=3.0.0,<8.0.0",
    "pystray>=0.19.0,<1.0.0",
    "pillow>=10.0.0,<12.0.0",
]

[project.urls]
Homepage = "https://github.com/premtechworks/AutoType-Linux"
Repository = "https://github.com/premtechworks/AutoType-Linux"
Issues = "https://github.com/premtechworks/AutoType-Linux/issues"

[project.scripts]
autotype = "autotype.cli:main"

[tool.setuptools.dynamic]
version = {attr = "autotype.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["autotype*", "audio*", "context*", "desktop*", "llm*", "stt*", "ui*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
