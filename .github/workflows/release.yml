name: Release AutoType

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils appstream

      - name: Run tests
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest
          pytest

      - name: Validate Desktop Entry and AppStream Metadata
        run: |
          desktop-file-validate io.github.premtechworks.AutoType.desktop
          appstreamcli validate io.github.premtechworks.AutoType.metainfo.xml

      - name: Run Build Pipeline
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * | grep -v "SHA256SUMS" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AutoType ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
