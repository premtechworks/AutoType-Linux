name: Release AutoType

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils appstream \
            python3-venv python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb \
            libportaudio2

      # PyGObject comes from the system (as it does for users), so the venv
      # must be built with --system-site-packages on the system interpreter.
      # The GTK tests need a display, which the runner has none of, and
      # Gtk.init() aborts the process rather than failing the test.
      - name: Run tests
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
          .venv/bin/pip install pytest
          xvfb-run -a .venv/bin/python -m pytest

      - name: Validate Desktop Entry and AppStream Metadata
        run: |
          desktop-file-validate io.github.premtechworks.AutoType.desktop
          appstreamcli validate io.github.premtechworks.AutoType.metainfo.xml

      - name: Run Build Pipeline
        run: |
          chmod +x scripts/build-all.sh
          ./scripts/build-all.sh

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * | grep -v "SHA256SUMS" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AutoType ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
