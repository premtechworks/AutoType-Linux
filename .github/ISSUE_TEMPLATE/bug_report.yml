name: Bug Report
description: Report a defect or unexpected behavior in AutoType
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AutoType! Please provide detailed diagnostic info.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Start autotype daemon
        2. Double-tap Right Alt
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: Diagnostic Info (autotype doctor --json)
      description: Please attach the output of `autotype doctor --json`.
      render: json
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Desktop Environment & OS
      description: OS version, desktop environment (e.g. Linux Mint 22 XFCE), display server (X11).
    validations:
      required: true
